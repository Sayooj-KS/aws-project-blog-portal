<!DOCTYPE html>
<html>
<head>

<title>Login</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>

.bg-animation{

    position:fixed;
    width:100%;
    height:100%;
    overflow:hidden;
    z-index:-1;
}

.bg-animation span{

    position:absolute;
    display:block;
    width:220px;
    height:220px;
    background:rgba(139,92,246,0.18);
    animation:animate 18s linear infinite;
    border-radius:50%;
    filter:blur(20px);
}

.bg-animation span:nth-child(1){
    left:10%;
    animation-duration:20s;
    top:20%;
}

.bg-animation span:nth-child(2){
    left:70%;
    animation-duration:25s;
    top:60%;
    background:rgba(34,211,238,0.18);
}

.bg-animation span:nth-child(3){
    left:40%;
    animation-duration:15s;
    top:80%;
    background:rgba(236,72,153,0.18);
}

@keyframes animate{

    0%{
        transform:translateY(0) scale(1);
    }

    50%{
        transform:translateY(-80px) scale(1.2);
    }

    100%{
        transform:translateY(0) scale(1);
    }
}

</style>

</head>

<body>

<div class="bg-animation">

<span></span>
<span></span>
<span></span>

</div>

<div class="center-box">

<div class="card">

<h2>Blog Portal Login 🚀</h2>

<form method="POST">

<input
type="text"
name="username"
placeholder="Username"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<button type="submit">

Login

</button>

</form>

<br>

<a href="/register">

Create Account

</a>

</div>

</div>

</body>
</html>
